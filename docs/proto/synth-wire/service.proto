syntax = "proto3";

package synth.wire;

option java_package = "io.synth.protocol.wire";
option java_multiple_files = true;
option csharp_namespace = "Synth.Wire";
option go_package = "synth/wire";

import "synth-wire/envelope.proto";
import "synth-wire/channel.proto";

// =============================================================================
// SYNTH WIRE SERVICE
// =============================================================================
//
// The unified gRPC service definition for PHP ↔ C++ communication.
// This service handles ALL communication patterns over a single interface.
//
// =============================================================================
// SERVICE OVERVIEW
// =============================================================================
//
//   ┌─────────────────────────────────────────────────────────────────────┐
//   │                      SYNTH WIRE SERVICE                             │
//   ├─────────────────────────────────────────────────────────────────────┤
//   │                                                                     │
//   │   C++ CLIENT                              PHP SERVER                │
//   │   ══════════                              ══════════                │
//   │                                                                     │
//   │   ┌─────────────────────────────────────────────────────────┐      │
//   │   │                    SynthWire Service                    │      │
//   │   ├─────────────────────────────────────────────────────────┤      │
//   │   │                                                         │      │
//   │   │   Exchange()     Bidirectional streaming (main channel) │      │
//   │   │   ───────────    Events, State, RPC all multiplexed     │      │
//   │   │                                                         │      │
//   │   │   Call()         Unary RPC (single request/response)    │      │
//   │   │   ───────        For simple tool invocations            │      │
//   │   │                                                         │      │
//   │   │   Subscribe()    Server streaming (event subscription)  │      │
//   │   │   ───────────    For event-only clients                 │      │
//   │   │                                                         │      │
//   │   │   Upload()       Client streaming (asset upload)        │      │
//   │   │   ────────       For chunked binary upload              │      │
//   │   │                                                         │      │
//   │   │   Download()     Server streaming (asset download)      │      │
//   │   │   ──────────     For chunked binary download            │      │
//   │   │                                                         │      │
//   │   └─────────────────────────────────────────────────────────┘      │
//   │                                                                     │
//   └─────────────────────────────────────────────────────────────────────┘
//
// =============================================================================

// The main service definition
service SynthWire {
    // =========================================================================
    // BIDIRECTIONAL STREAMING (Primary)
    // =========================================================================
    //
    // Main communication channel. Supports all payload types multiplexed
    // over a single stream. Client and server can send independently.
    //
    // Usage:
    //   - Events: Server pushes, client receives
    //   - State Sync: Bidirectional deltas and corrections
    //   - RPC: Request/response pairs via correlation_id
    //   - Assets: Chunked transfers in either direction
    //
    rpc Exchange(stream SynthEnvelope) returns (stream SynthEnvelope);

    // =========================================================================
    // UNARY RPC
    // =========================================================================
    //
    // Simple request/response for MCP tool invocations and queries.
    // Equivalent to HTTP POST with single response.
    //
    // Usage:
    //   - MCP tool calls: asset/resolve, storage/list, etc.
    //   - Queries: Get asset metadata, list scenes, etc.
    //
    rpc Call(SynthEnvelope) returns (SynthEnvelope);

    // =========================================================================
    // SERVER STREAMING
    // =========================================================================
    //
    // Subscribe to event channels. Server pushes events until client cancels.
    //
    // Usage:
    //   - Event subscription without bidirectional overhead
    //   - Read-only clients (monitoring, logging)
    //
    rpc Subscribe(SubscribeRequest) returns (stream SynthEnvelope);

    // =========================================================================
    // CLIENT STREAMING (Upload)
    // =========================================================================
    //
    // Chunked upload from client to server.
    //
    // Usage:
    //   - Large asset uploads
    //   - Scene file uploads
    //
    rpc Upload(stream SynthEnvelope) returns (UploadResponse);

    // =========================================================================
    // SERVER STREAMING (Download)
    // =========================================================================
    //
    // Chunked download from server to client.
    //
    // Usage:
    //   - Large asset downloads
    //   - Scene file downloads
    //
    rpc Download(DownloadRequest) returns (stream SynthEnvelope);

    // =========================================================================
    // SESSION MANAGEMENT
    // =========================================================================

    // Establish session with handshake
    rpc Connect(HandshakeRequest) returns (HandshakeResponse);

    // Graceful disconnect
    rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);

    // Keep-alive ping
    rpc Ping(PingRequest) returns (PongResponse);
}

// =============================================================================
// SERVICE MESSAGES
// =============================================================================

message SubscribeRequest {
    // Channels to subscribe (supports wildcards: synth/events/*)
    repeated string channels = 1;

    // Filters
    map<string, string> filters = 2;

    // Start from specific point
    oneof start_from {
        int64 from_timestamp = 10;    // Unix ms
        uint64 from_sequence = 11;
        string from_cursor = 12;
    }

    // Flow control
    int32 max_messages = 20;          // 0 = unlimited
    int32 batch_size = 21;
}

message UploadResponse {
    bool success = 1;
    string asset_id = 2;
    string uri = 3;
    int64 total_bytes = 4;
    string checksum = 5;

    // Error if failed
    string error_code = 10;
    string error_message = 11;
}

message DownloadRequest {
    // What to download
    oneof target {
        string asset_id = 1;
        string uri = 2;
    }

    // Partial download
    int64 offset = 10;
    int64 length = 11;                // 0 = all

    // Conditional
    string if_none_match = 20;        // ETag/checksum
}

message DisconnectRequest {
    string reason = 1;
}

message DisconnectResponse {
    bool acknowledged = 1;
}

message PingRequest {
    int64 timestamp = 1;
}

message PongResponse {
    int64 ping_timestamp = 1;
    int64 pong_timestamp = 2;
    int64 server_time = 3;
}

