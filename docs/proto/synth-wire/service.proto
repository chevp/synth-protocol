// =============================================================================
// ERROR CODES
// =============================================================================
//
// Standard error codes for RPC responses:
//
//   1xxx - Client errors
//   ────────────────────
//   1000 - Invalid request
//   1001 - Authentication required
//   1002 - Permission denied
//   1003 - Resource not found
//   1004 - Validation failed
//   1005 - Rate limited
//   1006 - Quota exceeded
//
//   2xxx - Server errors
//   ────────────────────
//   2000 - Internal error
//   2001 - Service unavailable
//   2002 - Timeout
//   2003 - Dependency failed
//
//   3xxx - Transport errors
//   ────────────────────
//   3000 - Connection lost
//   3001 - Message too large
//   3002 - Compression error
//
// =============================================================================

enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;

    // Client errors (1xxx)
    ERROR_CODE_INVALID_REQUEST = 1000;
    ERROR_CODE_AUTH_REQUIRED = 1001;
    ERROR_CODE_PERMISSION_DENIED = 1002;
    ERROR_CODE_NOT_FOUND = 1003;
    ERROR_CODE_VALIDATION_FAILED = 1004;
    ERROR_CODE_RATE_LIMITED = 1005;
    ERROR_CODE_QUOTA_EXCEEDED = 1006;

    // Server errors (2xxx)
    ERROR_CODE_INTERNAL = 2000;
    ERROR_CODE_UNAVAILABLE = 2001;
    ERROR_CODE_TIMEOUT = 2002;
    ERROR_CODE_DEPENDENCY_FAILED = 2003;

    // Transport errors (3xxx)
    ERROR_CODE_CONNECTION_LOST = 3000;
    ERROR_CODE_MESSAGE_TOO_LARGE = 3001;
    ERROR_CODE_COMPRESSION_ERROR = 3002;
}