syntax = "proto3";

package synth.agents;

option java_package = "io.synth.protocol.agents";
option java_multiple_files = true;

import "synth-core/common.proto";

// =============================================================================
// AGENT-SPEZIFISCHE DEFINITIONEN
// Diese Typen gehören NICHT in synth-core, da sie plugin-spezifisch sind
// =============================================================================

// Autonomous Agent Definition
message AgentDefinition {
    string id = 1;
    string name = 2;
    AgentType type = 3;
    AgentCapabilities capabilities = 4;
    AgentConfig config = 5;
    repeated string model_ids = 6;
}

enum AgentType {
    AGENT_TYPE_UNSPECIFIED = 0;
    AGENT_TYPE_REACTIVE = 1;      // Simple stimulus-response
    AGENT_TYPE_DELIBERATIVE = 2;   // Planning-based
    AGENT_TYPE_HYBRID = 3;         // Combined approach
    AGENT_TYPE_LEARNING = 4;       // Adaptive/learning agent
}

message AgentCapabilities {
    bool can_plan = 1;
    bool can_learn = 2;
    bool can_communicate = 3;
    bool can_collaborate = 4;
    repeated string supported_tasks = 5;
}

message AgentConfig {
    float decision_threshold = 1;
    int32 max_planning_depth = 2;
    float exploration_rate = 3;
    map<string, string> custom_params = 4;
}

// =============================================================================
// AGENT TASK EXECUTION (Plugin-spezifisch)
// =============================================================================

message AgentTask {
    string task_id = 1;
    string agent_id = 2;
    TaskType type = 3;
    TaskInput input = 4;
    TaskPriority priority = 5;
}

enum TaskType {
    TASK_TYPE_UNSPECIFIED = 0;
    TASK_TYPE_ANALYZE = 1;
    TASK_TYPE_GENERATE = 2;
    TASK_TYPE_TRANSFORM = 3;
    TASK_TYPE_CLASSIFY = 4;
    TASK_TYPE_OPTIMIZE = 5;
}

enum TaskPriority {
    TASK_PRIORITY_UNSPECIFIED = 0;
    TASK_PRIORITY_LOW = 1;
    TASK_PRIORITY_NORMAL = 2;
    TASK_PRIORITY_HIGH = 3;
    TASK_PRIORITY_CRITICAL = 4;
}

message TaskInput {
    oneof input {
        bytes raw_data = 1;
        string text = 2;
        string uri = 3;
        synth.common.Tensor tensor = 4;
    }
    map<string, string> context = 5;
}

message TaskResult {
    string task_id = 1;
    TaskStatus status = 2;
    oneof output {
        bytes raw_data = 3;
        string text = 4;
        synth.common.Tensor tensor = 5;
    }
    float confidence = 6;
    map<string, string> metadata = 7;
}

// PLUGIN-SPEZIFISCH: Task State Machine
enum TaskStatus {
    TASK_STATUS_UNSPECIFIED = 0;
    TASK_STATUS_PENDING = 1;
    TASK_STATUS_RUNNING = 2;
    TASK_STATUS_COMPLETED = 3;
    TASK_STATUS_FAILED = 4;
    TASK_STATUS_CANCELLED = 5;
}

// =============================================================================
// AGENT COMMUNICATION (Plugin-spezifisch)
// =============================================================================

message AgentMessage {
    string from_agent_id = 1;
    string to_agent_id = 2;
    MessageType type = 3;
    string content = 4;
    int64 timestamp = 5;
}

enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;
    MESSAGE_TYPE_REQUEST = 1;
    MESSAGE_TYPE_RESPONSE = 2;
    MESSAGE_TYPE_BROADCAST = 3;
    MESSAGE_TYPE_ACK = 4;
}

// =============================================================================
// AGENT SERVICE
// =============================================================================

service AgentService {
    rpc ExecuteTask(AgentTask) returns (TaskResult);
    rpc StreamTasks(stream AgentTask) returns (stream TaskResult);
    rpc GetAgentStatus(AgentStatusRequest) returns (AgentStatusResponse);
}

message AgentStatusRequest {
    string agent_id = 1;
}

message AgentStatusResponse {
    string agent_id = 1;
    AgentState state = 2;
    int32 active_tasks = 3;
    float cpu_usage = 4;
    float memory_usage = 5;
}

// PLUGIN-SPEZIFISCH: Agent Runtime State Machine
// Unterscheidet sich von PluginLifecycleState (synth-core/plugin.proto)
enum AgentState {
    AGENT_STATE_UNSPECIFIED = 0;
    AGENT_STATE_IDLE = 1;
    AGENT_STATE_BUSY = 2;
    AGENT_STATE_OVERLOADED = 3;
    AGENT_STATE_ERROR = 4;
}