syntax = "proto3";

package synth;

option java_package = "io.synth.protocol";
option java_multiple_files = true;

import "synth/model.proto";

// Text Processing
message TextProcessingRequest {
    string request_id = 1;
    string text = 2;
    string language = 3;
    repeated NlpTask tasks = 4;
}

enum NlpTask {
    NLP_TASK_UNSPECIFIED = 0;
    NLP_TASK_TOKENIZE = 1;
    NLP_TASK_SENTIMENT = 2;
    NLP_TASK_NER = 3;
    NLP_TASK_SUMMARIZE = 4;
    NLP_TASK_TRANSLATE = 5;
    NLP_TASK_EMBED = 6;
    NLP_TASK_CLASSIFY = 7;
}

message TextProcessingResponse {
    string request_id = 1;
    TokenizationResult tokenization = 2;
    SentimentResult sentiment = 3;
    repeated NamedEntity entities = 4;
    string summary = 5;
    string translation = 6;
    Tensor embedding = 7;
    repeated TextClassification classifications = 8;
}

message TokenizationResult {
    repeated string tokens = 1;
    repeated int32 token_ids = 2;
    repeated TokenSpan spans = 3;
}

message TokenSpan {
    int32 start = 1;
    int32 end = 2;
    string text = 3;
}

message SentimentResult {
    SentimentLabel label = 1;
    float positive_score = 2;
    float negative_score = 3;
    float neutral_score = 4;
}

enum SentimentLabel {
    SENTIMENT_UNSPECIFIED = 0;
    SENTIMENT_POSITIVE = 1;
    SENTIMENT_NEGATIVE = 2;
    SENTIMENT_NEUTRAL = 3;
    SENTIMENT_MIXED = 4;
}

message NamedEntity {
    string text = 1;
    EntityType type = 2;
    float confidence = 3;
    TokenSpan span = 4;
}

enum EntityType {
    ENTITY_TYPE_UNSPECIFIED = 0;
    ENTITY_TYPE_PERSON = 1;
    ENTITY_TYPE_ORGANIZATION = 2;
    ENTITY_TYPE_LOCATION = 3;
    ENTITY_TYPE_DATE = 4;
    ENTITY_TYPE_MONEY = 5;
    ENTITY_TYPE_PRODUCT = 6;
    ENTITY_TYPE_EVENT = 7;
}

message TextClassification {
    string label = 1;
    float confidence = 2;
}

// Text Generation
message TextGenerationRequest {
    string prompt = 1;
    GenerationConfig config = 2;
    string model_id = 3;
}

message GenerationConfig {
    int32 max_tokens = 1;
    float temperature = 2;
    float top_p = 3;
    int32 top_k = 4;
    repeated string stop_sequences = 5;
    bool stream = 6;
}

message TextGenerationResponse {
    string generated_text = 1;
    int32 tokens_generated = 2;
    string finish_reason = 3;
    GenerationMetrics metrics = 4;
}

message GenerationMetrics {
    float latency_ms = 1;
    int32 prompt_tokens = 2;
    int32 completion_tokens = 3;
}

// Semantic Search
message SemanticSearchRequest {
    string query = 1;
    string collection_id = 2;
    int32 top_k = 3;
    float min_score = 4;
}

message SemanticSearchResponse {
    repeated SearchResult results = 1;
}

message SearchResult {
    string document_id = 1;
    string content = 2;
    float score = 3;
    map<string, string> metadata = 4;
}

// gRPC Service
service NlpService {
    rpc ProcessText(TextProcessingRequest) returns (TextProcessingResponse);
    rpc GenerateText(TextGenerationRequest) returns (TextGenerationResponse);
    rpc StreamGenerate(TextGenerationRequest) returns (stream TextGenerationResponse);
    rpc SemanticSearch(SemanticSearchRequest) returns (SemanticSearchResponse);
}
