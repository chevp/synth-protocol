<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synth Editor Prototype</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background: #0f0f1a;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #2a2a4a;
        }
        header h1 {
            font-size: 16px;
            font-weight: 500;
            color: #e94560;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        header h1 .logo {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #e94560, #c084fc);
            border-radius: 4px;
        }
        .file-name {
            font-size: 13px;
            color: #888;
        }
        .file-name .modified {
            color: #fbbf24;
        }
        .header-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        .header-actions button {
            background: #0f3460;
            border: none;
            color: #eee;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .header-actions button:hover {
            background: #e94560;
        }

        /* Tabs */
        .tabs {
            background: #16213e;
            display: flex;
            border-bottom: 1px solid #2a2a4a;
        }
        .tab {
            padding: 10px 20px;
            font-size: 13px;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab:hover {
            color: #eee;
            background: #1a1a2e;
        }
        .tab.active {
            color: #e94560;
            border-bottom-color: #e94560;
            background: #1a1a2e;
        }

        /* Main container */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #16213e;
            border-right: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 10px 12px;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
        }
        .sidebar-header button:hover {
            color: #e94560;
        }

        /* Tree view */
        .tree-view {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .tree-item {
            display: flex;
            align-items: center;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 13px;
            gap: 6px;
        }
        .tree-item:hover {
            background: #1a1a2e;
        }
        .tree-item.selected {
            background: #0f3460;
        }
        .tree-item .icon {
            font-size: 12px;
            width: 16px;
            text-align: center;
        }
        .tree-item .icon.scene { color: #60a5fa; }
        .tree-item .icon.folder { color: #fbbf24; }
        .tree-item .icon.node { color: #34d399; }
        .tree-item .icon.component { color: #c084fc; }
        .tree-item .icon.asset { color: #fb923c; }
        .tree-item .icon.mcp { color: #f472b6; }
        .tree-item .icon.agent { color: #22d3ee; }
        .tree-item .expand {
            width: 16px;
            font-size: 10px;
            color: #666;
        }
        .tree-item .name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tree-item.indent-1 { padding-left: 28px; }
        .tree-item.indent-2 { padding-left: 44px; }
        .tree-item.indent-3 { padding-left: 60px; }

        /* Content area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Tab panels */
        .tab-panel {
            flex: 1;
            display: none;
            overflow: hidden;
        }
        .tab-panel.active {
            display: flex;
            flex-direction: column;
        }

        /* Structure panel */
        .structure-panel {
            display: flex;
            flex: 1;
        }
        .inspector {
            width: 300px;
            background: #16213e;
            border-left: 1px solid #2a2a4a;
            overflow-y: auto;
        }
        .inspector-header {
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 1px solid #2a2a4a;
            color: #e94560;
        }
        .inspector-section {
            border-bottom: 1px solid #2a2a4a;
        }
        .inspector-section-header {
            padding: 10px 12px;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .inspector-section-header:hover {
            background: #1a1a2e;
        }
        .inspector-content {
            padding: 8px 12px;
        }
        .property-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .property-row label {
            width: 80px;
            color: #888;
        }
        .property-row input, .property-row select {
            flex: 1;
            background: #0f3460;
            border: 1px solid #2a2a4a;
            color: #eee;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .property-row input:focus, .property-row select:focus {
            outline: none;
            border-color: #e94560;
        }
        .vector-inputs {
            display: flex;
            gap: 4px;
            flex: 1;
        }
        .vector-inputs input {
            width: 50px;
            text-align: center;
        }
        .vector-inputs .label {
            color: #666;
            font-size: 10px;
            width: 12px;
        }

        /* Events panel - CodeMirror */
        .events-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .events-panel .CodeMirror {
            flex: 1;
            height: auto;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a2e;
        }
        .events-panel .CodeMirror-gutters {
            background: #16213e;
            border-right: 1px solid #2a2a4a;
        }
        .cm-synth-domain { color: #60a5fa; font-weight: bold; }
        .cm-synth-resource { color: #c084fc; }
        .cm-synth-action { color: #34d399; font-weight: bold; }
        .cm-synth-subject { color: #fbbf24; }
        .cm-synth-modifier { color: #f472b6; }
        .cm-synth-arg-key { color: #e06c75; }
        .cm-synth-arg-value { color: #d19a66; }
        .cm-synth-comment { color: #5c6370; font-style: italic; }

        /* XML panel */
        .xml-panel .CodeMirror {
            flex: 1;
            height: auto;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a2e;
        }

        /* Event console */
        .event-console {
            height: 150px;
            background: #0f0f1a;
            border-top: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
        }
        .console-header {
            padding: 6px 12px;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
        }
        .console-header .event-count {
            color: #e94560;
        }
        .console-content {
            flex: 1;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            padding: 8px 12px;
        }
        .console-event {
            padding: 2px 0;
            display: flex;
            gap: 8px;
        }
        .console-event .time {
            color: #666;
            font-size: 10px;
            min-width: 60px;
        }
        .console-event .domain { color: #60a5fa; }
        .console-event .resource { color: #c084fc; }
        .console-event .action { color: #34d399; }
        .console-event .subject { color: #fbbf24; }
        .console-event .modifier { color: #f472b6; }
        .console-event .target { color: #fb923c; }
        .console-input {
            display: flex;
            border-top: 1px solid #2a2a4a;
        }
        .console-input .prompt {
            padding: 8px 12px;
            color: #34d399;
            font-family: 'Consolas', monospace;
        }
        .console-input input {
            flex: 1;
            background: transparent;
            border: none;
            color: #eee;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            padding: 8px 0;
        }
        .console-input input:focus {
            outline: none;
        }

        /* Status bar */
        .status-bar {
            background: #0f3460;
            padding: 4px 16px;
            font-size: 11px;
            color: #888;
            display: flex;
            gap: 20px;
        }
        .status-bar .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-bar .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-bar .indicator.green { background: #34d399; }
        .status-bar .indicator.yellow { background: #fbbf24; }
        .status-bar .indicator.red { background: #ef4444; }

        /* CodeMirror hints */
        .CodeMirror-hints {
            background: #16213e;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
        }
        .CodeMirror-hint {
            padding: 4px 8px;
            color: #eee;
        }
        .CodeMirror-hint-active {
            background: #e94560;
        }

        /* Splitter */
        .splitter {
            width: 4px;
            background: #2a2a4a;
            cursor: col-resize;
        }
        .splitter:hover {
            background: #e94560;
        }

        /* 3D Preview placeholder */
        .preview-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f1a;
            color: #666;
            font-size: 14px;
        }
        .preview-placeholder {
            text-align: center;
        }
        .preview-placeholder .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <h1><div class="logo"></div> Synth Editor</h1>
        <span class="file-name">my_project.synth.xml <span class="modified">*</span></span>
        <div class="header-actions">
            <button onclick="newFile()">New</button>
            <button onclick="saveFile()">Save</button>
            <button onclick="exportEvents()">Export Events</button>
        </div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-tab="structure" onclick="switchTab('structure')">Structure</div>
        <div class="tab" data-tab="events" onclick="switchTab('events')">Events</div>
        <div class="tab" data-tab="xml" onclick="switchTab('xml')">Raw XML</div>
        <div class="tab" data-tab="preview" onclick="switchTab('preview')">Preview</div>
    </div>

    <!-- Main container -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>Project Structure</span>
                <button onclick="addNode()">+</button>
            </div>
            <div class="tree-view" id="treeView"></div>
        </div>

        <div class="splitter"></div>

        <!-- Content area -->
        <div class="content-area">
            <!-- Structure Panel -->
            <div class="tab-panel active" id="panel-structure">
                <div class="structure-panel">
                    <div style="flex: 1; display: flex; flex-direction: column;">
                        <!-- Viewport placeholder -->
                        <div style="flex: 1; background: #0f0f1a; display: flex; align-items: center; justify-content: center;">
                            <div class="preview-placeholder">
                                <div class="icon">🎬</div>
                                <div>Scene Viewport</div>
                                <div style="font-size: 11px; color: #555; margin-top: 5px;">Select a node to view properties</div>
                            </div>
                        </div>
                    </div>
                    <!-- Inspector -->
                    <div class="inspector" id="inspector">
                        <div class="inspector-header">Inspector</div>
                        <div id="inspectorContent">
                            <div style="padding: 20px; color: #666; text-align: center; font-size: 12px;">
                                Select a node to view properties
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Events Panel -->
            <div class="tab-panel" id="panel-events">
                <div class="events-panel">
                    <textarea id="eventsEditor"></textarea>
                </div>
            </div>

            <!-- XML Panel -->
            <div class="tab-panel" id="panel-xml">
                <div class="xml-panel" style="flex: 1; display: flex; flex-direction: column;">
                    <textarea id="xmlEditor"></textarea>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="tab-panel" id="panel-preview">
                <div class="preview-panel">
                    <div class="preview-placeholder">
                        <div class="icon">🖼️</div>
                        <div>3D Preview</div>
                        <div style="font-size: 11px; color: #555; margin-top: 5px;">WebGL renderer would go here</div>
                    </div>
                </div>
            </div>

            <!-- Event Console -->
            <div class="event-console">
                <div class="console-header">
                    <span>Event Console</span>
                    <span class="event-count" id="eventCount">0 events</span>
                </div>
                <div class="console-content" id="consoleContent"></div>
                <div class="console-input">
                    <span class="prompt">&gt;</span>
                    <input type="text" id="consoleInput" placeholder="Enter event command..." onkeydown="handleConsoleInput(event)">
                </div>
            </div>
        </div>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
        <div class="status-item">
            <div class="indicator green"></div>
            <span>Connected</span>
        </div>
        <div class="status-item">
            <span>Nodes: <strong id="nodeCount">5</strong></span>
        </div>
        <div class="status-item">
            <span>Events: <strong id="totalEvents">0</strong></span>
        </div>
        <div class="status-item" style="margin-left: auto;">
            <span>Synth Protocol v1.0</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script>
        // Project state
        let projectState = {
            meta: {
                name: 'My Project',
                created: new Date().toISOString(),
                modified: new Date().toISOString()
            },
            scenes: [
                {
                    id: 'scene_outdoor',
                    name: 'Outdoor Scene',
                    state: 'active',
                    nodes: [
                        {
                            id: 'folder_vegetation',
                            type: 'folder',
                            name: 'Vegetation',
                            children: [
                                {
                                    id: 'node_tree_01',
                                    type: 'asset',
                                    name: 'Oak Tree',
                                    components: {
                                        transform: { position: [10, 0, 5], rotation: [0, 45, 0], scale: [1, 1, 1] },
                                        material: { ref: 'mat_bark_pbr' }
                                    }
                                },
                                {
                                    id: 'node_tree_02',
                                    type: 'asset',
                                    name: 'Pine Tree',
                                    components: {
                                        transform: { position: [-5, 0, 8], rotation: [0, 0, 0], scale: [1.2, 1.2, 1.2] }
                                    }
                                }
                            ]
                        },
                        {
                            id: 'node_rock_01',
                            type: 'asset',
                            name: 'Boulder',
                            components: {
                                transform: { position: [0, 0, 0], rotation: [0, 0, 0], scale: [2, 2, 2] }
                            }
                        }
                    ]
                }
            ],
            mcp: [
                { id: 'mcp_vision', transport: 'stdio', name: 'Vision Server' }
            ],
            agents: [
                { id: 'agent_vision_01', type: 'reactive', name: 'Vision Analyzer' }
            ]
        };

        let eventHistory = [];
        let selectedNode = null;

        // Schema for events
        const SCHEMA = {
            domains: ['scene', 'cluster', 'component', 'mcp', 'agent', 'project', 'asset', 'plugin', 'system'],
            resources: ['node', 'server', 'tool', 'task', 'selection', 'folder', 'file', 'setting', 'session'],
            actions: ['create', 'update', 'delete', 'start', 'stop', 'enable', 'disable', 'move', 'rename', 'select', 'connect', 'disconnect', 'reconnect', 'invoke', 'complete', 'fail', 'cancel', 'progress', 'health', 'error', 'register', 'unregister', 'init', 'open', 'save', 'close'],
            modifiers: ['to', 'from', 'in', 'with', 'by', 'for', 'on', 'at']
        };

        // Initialize tree view
        function renderTree() {
            const treeView = document.getElementById('treeView');
            let html = '';

            // Scenes
            projectState.scenes.forEach(scene => {
                html += `<div class="tree-item ${selectedNode === scene.id ? 'selected' : ''}" onclick="selectNode('${scene.id}', 'scene')">
                    <span class="expand">▼</span>
                    <span class="icon scene">◆</span>
                    <span class="name">${scene.name}</span>
                </div>`;

                // Nodes
                renderNodes(scene.nodes, 1).forEach(nodeHtml => html += nodeHtml);
            });

            // MCP Servers
            html += `<div class="tree-item">
                <span class="expand">▼</span>
                <span class="icon mcp">⚡</span>
                <span class="name">MCP Servers</span>
            </div>`;
            projectState.mcp.forEach(server => {
                html += `<div class="tree-item indent-1 ${selectedNode === server.id ? 'selected' : ''}" onclick="selectNode('${server.id}', 'mcp')">
                    <span class="expand"></span>
                    <span class="icon mcp">●</span>
                    <span class="name">${server.name}</span>
                </div>`;
            });

            // Agents
            html += `<div class="tree-item">
                <span class="expand">▼</span>
                <span class="icon agent">🤖</span>
                <span class="name">Agents</span>
            </div>`;
            projectState.agents.forEach(agent => {
                html += `<div class="tree-item indent-1 ${selectedNode === agent.id ? 'selected' : ''}" onclick="selectNode('${agent.id}', 'agent')">
                    <span class="expand"></span>
                    <span class="icon agent">●</span>
                    <span class="name">${agent.name}</span>
                </div>`;
            });

            treeView.innerHTML = html;
            document.getElementById('nodeCount').textContent = countNodes();
        }

        function renderNodes(nodes, indent) {
            const result = [];
            nodes.forEach(node => {
                const isFolder = node.type === 'folder';
                const hasChildren = node.children && node.children.length > 0;
                const iconClass = isFolder ? 'folder' : 'node';
                const icon = isFolder ? '📁' : '■';

                result.push(`<div class="tree-item indent-${indent} ${selectedNode === node.id ? 'selected' : ''}" onclick="selectNode('${node.id}', '${node.type}')">
                    <span class="expand">${hasChildren ? '▼' : ''}</span>
                    <span class="icon ${iconClass}">${icon}</span>
                    <span class="name">${node.name}</span>
                </div>`);

                if (hasChildren) {
                    result.push(...renderNodes(node.children, indent + 1));
                }
            });
            return result;
        }

        function countNodes() {
            let count = 0;
            function countRecursive(nodes) {
                nodes.forEach(n => {
                    count++;
                    if (n.children) countRecursive(n.children);
                });
            }
            projectState.scenes.forEach(s => countRecursive(s.nodes));
            return count;
        }

        function selectNode(id, type) {
            selectedNode = id;
            renderTree();
            renderInspector(id, type);
        }

        function renderInspector(id, type) {
            const container = document.getElementById('inspectorContent');
            const node = findNode(id);

            if (!node) {
                container.innerHTML = '<div style="padding: 20px; color: #666; text-align: center; font-size: 12px;">Node not found</div>';
                return;
            }

            let html = `
                <div class="inspector-section">
                    <div class="inspector-section-header">▼ General</div>
                    <div class="inspector-content">
                        <div class="property-row">
                            <label>ID</label>
                            <input type="text" value="${node.id}" readonly style="color: #666;">
                        </div>
                        <div class="property-row">
                            <label>Name</label>
                            <input type="text" value="${node.name}" onchange="updateProperty('${id}', 'name', this.value)">
                        </div>
                        <div class="property-row">
                            <label>Type</label>
                            <input type="text" value="${node.type || type}" readonly style="color: #666;">
                        </div>
                    </div>
                </div>
            `;

            if (node.components) {
                if (node.components.transform) {
                    const t = node.components.transform;
                    html += `
                        <div class="inspector-section">
                            <div class="inspector-section-header">▼ Transform</div>
                            <div class="inspector-content">
                                <div class="property-row">
                                    <label>Position</label>
                                    <div class="vector-inputs">
                                        <span class="label">X</span>
                                        <input type="number" value="${t.position[0]}" onchange="updateTransform('${id}', 'position', 0, this.value)">
                                        <span class="label">Y</span>
                                        <input type="number" value="${t.position[1]}" onchange="updateTransform('${id}', 'position', 1, this.value)">
                                        <span class="label">Z</span>
                                        <input type="number" value="${t.position[2]}" onchange="updateTransform('${id}', 'position', 2, this.value)">
                                    </div>
                                </div>
                                <div class="property-row">
                                    <label>Rotation</label>
                                    <div class="vector-inputs">
                                        <span class="label">X</span>
                                        <input type="number" value="${t.rotation[0]}" onchange="updateTransform('${id}', 'rotation', 0, this.value)">
                                        <span class="label">Y</span>
                                        <input type="number" value="${t.rotation[1]}" onchange="updateTransform('${id}', 'rotation', 1, this.value)">
                                        <span class="label">Z</span>
                                        <input type="number" value="${t.rotation[2]}" onchange="updateTransform('${id}', 'rotation', 2, this.value)">
                                    </div>
                                </div>
                                <div class="property-row">
                                    <label>Scale</label>
                                    <div class="vector-inputs">
                                        <span class="label">X</span>
                                        <input type="number" value="${t.scale[0]}" step="0.1" onchange="updateTransform('${id}', 'scale', 0, this.value)">
                                        <span class="label">Y</span>
                                        <input type="number" value="${t.scale[1]}" step="0.1" onchange="updateTransform('${id}', 'scale', 1, this.value)">
                                        <span class="label">Z</span>
                                        <input type="number" value="${t.scale[2]}" step="0.1" onchange="updateTransform('${id}', 'scale', 2, this.value)">
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (node.components.material) {
                    html += `
                        <div class="inspector-section">
                            <div class="inspector-section-header">▼ Material</div>
                            <div class="inspector-content">
                                <div class="property-row">
                                    <label>Reference</label>
                                    <input type="text" value="${node.components.material.ref}">
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            container.innerHTML = html;
        }

        function findNode(id) {
            // Search in scenes
            for (const scene of projectState.scenes) {
                if (scene.id === id) return scene;
                const found = findNodeInList(scene.nodes, id);
                if (found) return found;
            }
            // Search in MCP
            for (const server of projectState.mcp) {
                if (server.id === id) return server;
            }
            // Search in Agents
            for (const agent of projectState.agents) {
                if (agent.id === id) return agent;
            }
            return null;
        }

        function findNodeInList(nodes, id) {
            for (const node of nodes) {
                if (node.id === id) return node;
                if (node.children) {
                    const found = findNodeInList(node.children, id);
                    if (found) return found;
                }
            }
            return null;
        }

        function updateProperty(id, prop, value) {
            const node = findNode(id);
            if (node) {
                node[prop] = value;
                emitEvent('cluster', 'node', 'update', id, { field: prop, value: value });
                renderTree();
            }
        }

        function updateTransform(id, prop, index, value) {
            const node = findNode(id);
            if (node && node.components && node.components.transform) {
                node.components.transform[prop][index] = parseFloat(value);
                emitEvent('component', 'node', 'update', `comp_transform_${id}`, { field: prop }, 'on', id);
            }
        }

        // Event system
        function emitEvent(domain, resource, action, subject, args = {}, modifier = '', target = '') {
            const event = {
                timestamp: Date.now(),
                domain, resource, action, subject, modifier, target, args
            };
            eventHistory.push(event);
            addToConsole(event);
            updateEventCount();
            updateXmlEditor();
        }

        function addToConsole(event) {
            const consoleContent = document.getElementById('consoleContent');
            const time = new Date(event.timestamp).toLocaleTimeString();

            let html = `<div class="console-event">
                <span class="time">${time}</span>
                <span class="domain">${event.domain}</span>`;

            if (event.resource) html += ` <span class="resource">${event.resource}</span>`;
            html += ` <span class="action">${event.action}</span>`;
            html += ` <span class="subject">${event.subject}</span>`;
            if (event.modifier) html += ` <span class="modifier">${event.modifier}</span> <span class="target">${event.target}</span>`;

            html += `</div>`;
            consoleContent.innerHTML += html;
            consoleContent.scrollTop = consoleContent.scrollHeight;
        }

        function updateEventCount() {
            document.getElementById('eventCount').textContent = `${eventHistory.length} events`;
            document.getElementById('totalEvents').textContent = eventHistory.length;
        }

        function handleConsoleInput(e) {
            if (e.key === 'Enter') {
                const input = e.target;
                const command = input.value.trim();
                if (command) {
                    parseAndExecuteCommand(command);
                    input.value = '';
                }
            }
        }

        function parseAndExecuteCommand(command) {
            const parts = command.split(/\s+/);
            if (parts.length < 3) return;

            let idx = 0;
            const domain = parts[idx++];

            let resource = '';
            if (SCHEMA.resources.includes(parts[idx])) {
                resource = parts[idx++];
            }

            const action = parts[idx++];
            const subject = parts[idx++] || '';

            let modifier = '';
            let target = '';
            if (idx < parts.length && SCHEMA.modifiers.includes(parts[idx])) {
                modifier = parts[idx++];
                target = parts[idx++] || '';
            }

            emitEvent(domain, resource, action, subject, {}, modifier, target);
        }

        // Tab switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

            document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
            document.getElementById(`panel-${tabId}`).classList.add('active');

            if (tabId === 'xml') {
                updateXmlEditor();
                xmlEditor.refresh();
            }
            if (tabId === 'events') {
                eventsEditor.refresh();
            }
        }

        // Generate XML from state
        function generateXml() {
            let xml = `<?xml version="1.0" encoding="UTF-8"?>
<synth version="1.0" xmlns="https://synth.dev/schema/1.0">

  <meta>
    <name>${projectState.meta.name}</name>
    <created>${projectState.meta.created}</created>
    <modified>${new Date().toISOString()}</modified>
  </meta>

  <scenes>`;

            projectState.scenes.forEach(scene => {
                xml += `
    <scene id="${scene.id}" name="${scene.name}" state="${scene.state}">
      <nodes>`;
                xml += generateNodesXml(scene.nodes, 4);
                xml += `
      </nodes>
    </scene>`;
            });

            xml += `
  </scenes>

  <mcp>`;
            projectState.mcp.forEach(server => {
                xml += `
    <server id="${server.id}" transport="${server.transport}" name="${server.name}"/>`;
            });
            xml += `
  </mcp>

  <agents>`;
            projectState.agents.forEach(agent => {
                xml += `
    <agent id="${agent.id}" type="${agent.type}" name="${agent.name}"/>`;
            });
            xml += `
  </agents>`;

            if (eventHistory.length > 0) {
                xml += `

  <history>`;
                eventHistory.slice(-50).forEach(e => {
                    xml += `
    <event ts="${e.timestamp}">
      <compact domain="${e.domain}" resource="${e.resource}" action="${e.action}"
               subject="${e.subject}"${e.modifier ? ` modifier="${e.modifier}" target="${e.target}"` : ''}/>
    </event>`;
                });
                xml += `
  </history>`;
            }

            xml += `

</synth>`;
            return xml;
        }

        function generateNodesXml(nodes, indent) {
            let xml = '';
            const spaces = ' '.repeat(indent * 2);

            nodes.forEach(node => {
                if (node.type === 'folder') {
                    xml += `
${spaces}<folder id="${node.id}" name="${node.name}">`;
                    if (node.children) {
                        xml += generateNodesXml(node.children, indent + 1);
                    }
                    xml += `
${spaces}</folder>`;
                } else {
                    xml += `
${spaces}<node id="${node.id}" type="${node.type}" name="${node.name}">`;
                    if (node.components) {
                        xml += `
${spaces}  <components>`;
                        if (node.components.transform) {
                            const t = node.components.transform;
                            xml += `
${spaces}    <transform position="${t.position.join(',')}" rotation="${t.rotation.join(',')}" scale="${t.scale.join(',')}"/>`;
                        }
                        if (node.components.material) {
                            xml += `
${spaces}    <material ref="${node.components.material.ref}"/>`;
                        }
                        xml += `
${spaces}  </components>`;
                    }
                    xml += `
${spaces}</node>`;
                }
            });

            return xml;
        }

        function updateXmlEditor() {
            if (xmlEditor) {
                xmlEditor.setValue(generateXml());
            }
        }

        // CodeMirror mode for events
        CodeMirror.defineMode('synth-events', function() {
            const domainRegex = new RegExp('^(' + SCHEMA.domains.join('|') + ')\\b', 'i');
            const resourceRegex = new RegExp('^(' + SCHEMA.resources.join('|') + ')\\b', 'i');
            const actionRegex = new RegExp('^(' + SCHEMA.actions.join('|') + ')\\b', 'i');
            const modifierRegex = new RegExp('^(' + SCHEMA.modifiers.join('|') + ')\\b', 'i');

            return {
                token: function(stream) {
                    if (stream.match(/^#.*/)) return 'synth-comment';
                    if (stream.match(/^--[a-zA-Z_][a-zA-Z0-9_]*=/)) return 'synth-arg-key';
                    if (stream.match(/^"[^"]*"/)) return 'synth-arg-value';
                    if (stream.match(domainRegex)) return 'synth-domain';
                    if (stream.match(resourceRegex)) return 'synth-resource';
                    if (stream.match(actionRegex)) return 'synth-action';
                    if (stream.match(modifierRegex)) return 'synth-modifier';
                    if (stream.match(/^[a-zA-Z_][a-zA-Z0-9_-]*/)) return 'synth-subject';
                    stream.next();
                    return null;
                }
            };
        });

        // Initialize editors
        const eventsEditor = CodeMirror.fromTextArea(document.getElementById('eventsEditor'), {
            mode: 'synth-events',
            lineNumbers: true,
            theme: 'default'
        });

        eventsEditor.setValue(`# Compact Event Editor
# Format: <domain> [resource] <action> <subject> [modifier target] [--args]

# Scene setup
scene create scene_outdoor --name="Outdoor Scene"

# Create nodes
cluster node create node_tree_01 in scene_outdoor --name="Oak Tree"
cluster node create node_tree_02 in scene_outdoor --name="Pine Tree"

# Add components
component node create comp_transform on node_tree_01 --type=transform
component node update comp_transform on node_tree_01 --position="10,0,5"

# MCP server
mcp server start mcp_vision --transport=stdio

# Agent task
agent task create task_analyze for agent_vision_01 --type=analyze
agent task complete task_analyze by agent_vision_01 --duration=2000
`);

        const xmlEditor = CodeMirror.fromTextArea(document.getElementById('xmlEditor'), {
            mode: 'xml',
            lineNumbers: true,
            theme: 'default',
            readOnly: false
        });

        // Initialize
        renderTree();
        updateXmlEditor();

        // Emit initial events
        setTimeout(() => {
            emitEvent('project', 'file', 'open', 'my_project', { path: '/projects/my_project.synth.xml' });
        }, 500);

        function newFile() {
            if (confirm('Create new project? Unsaved changes will be lost.')) {
                projectState = {
                    meta: { name: 'New Project', created: new Date().toISOString(), modified: new Date().toISOString() },
                    scenes: [{ id: 'scene_main', name: 'Main Scene', state: 'active', nodes: [] }],
                    mcp: [],
                    agents: []
                };
                eventHistory = [];
                selectedNode = null;
                renderTree();
                updateXmlEditor();
                document.getElementById('consoleContent').innerHTML = '';
                updateEventCount();
                emitEvent('project', '', 'init', 'new_project');
            }
        }

        function saveFile() {
            emitEvent('project', '', 'save', 'my_project');
            alert('Project saved! (simulated)');
        }

        function exportEvents() {
            const events = eventHistory.map(e => {
                let str = `${e.domain}`;
                if (e.resource) str += ` ${e.resource}`;
                str += ` ${e.action} ${e.subject}`;
                if (e.modifier) str += ` ${e.modifier} ${e.target}`;
                return str;
            }).join('\n');

            const blob = new Blob([events], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'events.txt';
            a.click();
        }

        function addNode() {
            const name = prompt('Node name:');
            if (name) {
                const id = 'node_' + Date.now();
                projectState.scenes[0].nodes.push({
                    id: id,
                    type: 'asset',
                    name: name,
                    components: {
                        transform: { position: [0, 0, 0], rotation: [0, 0, 0], scale: [1, 1, 1] }
                    }
                });
                emitEvent('cluster', 'node', 'create', id, { name: name }, 'in', 'scene_outdoor');
                renderTree();
            }
        }
    </script>
</body>
</html>
