syntax = "proto3";

package nuna.core;

option java_package = "io.nuna.protocol.core";
option java_multiple_files = true;

// =============================================================================
// NUNA CORE PROTOCOL
// Fundamental types for the Closed Monolith Plugin System
// Designed for SQLite3 storage (each message = table row)
// =============================================================================

// =============================================================================
// IDENTIFIERS
// All entities use UUID-based identification
// =============================================================================

message EntityId {
    string uuid = 1;                    // Primary key for SQLite
    int64 version = 2;                  // Optimistic locking / row version
    int64 created_at = 3;               // Unix timestamp ms
    int64 updated_at = 4;               // Unix timestamp ms
}

// =============================================================================
// CLUSTER NODE
// SQLite Table: cluster_nodes
// Unified tree structure for project content (replaces Entity and Scene)
// =============================================================================

message ClusterNode {
    EntityId id = 1;
    string name = 2;
    ClusterNodeType node_type = 3;
    ClusterNodeState state = 4;

    // Hierarchy - bidirectional for fast UI navigation
    string parent_id = 5;               // Parent node UUID (nullable for root)
    repeated string child_ids = 6;      // Direct children for tree traversal
    int32 sibling_order = 7;            // Position among siblings (0-based)

    // Metadata
    repeated string tag_ids = 8;        // Foreign keys to tags table
    bytes metadata = 9;                 // JSON blob for extensible data
}

enum ClusterNodeType {
    CLUSTER_NODE_TYPE_UNSPECIFIED = 0;
    CLUSTER_NODE_TYPE_PROJECT = 1;      // Root node - only one per file
    CLUSTER_NODE_TYPE_SCENE = 2;        // Scene/Workspace container
    CLUSTER_NODE_TYPE_FOLDER = 3;       // Folder/Directory
    CLUSTER_NODE_TYPE_DOCUMENT = 4;     // Text document
    CLUSTER_NODE_TYPE_ASSET = 5;        // Asset reference
    CLUSTER_NODE_TYPE_GROUP = 6;        // Logical grouping
}

enum ClusterNodeState {
    CLUSTER_NODE_STATE_UNSPECIFIED = 0;
    CLUSTER_NODE_STATE_ACTIVE = 1;
    CLUSTER_NODE_STATE_COLLAPSED = 2;   // UI state: collapsed in tree
    CLUSTER_NODE_STATE_HIDDEN = 3;
    CLUSTER_NODE_STATE_DELETED = 4;     // Soft delete
    CLUSTER_NODE_STATE_ARCHIVED = 5;
}

// =============================================================================
// ECS CORE: COMPONENT
// SQLite Table: components
// =============================================================================

message Component {
    EntityId id = 1;
    string cluster_node_id = 2;         // Foreign key to cluster_nodes
    string component_type = 3;          // e.g., "transform", "mesh", "script", "scene_settings"
    ComponentState state = 4;
    bytes data = 5;                     // Serialized component data (protobuf)
    string schema_version = 6;          // For migration support
}

enum ComponentState {
    COMPONENT_STATE_UNSPECIFIED = 0;
    COMPONENT_STATE_ENABLED = 1;
    COMPONENT_STATE_DISABLED = 2;
}

// =============================================================================
// ECS CORE: SYSTEM
// SQLite Table: systems
// Systems are provided by MCP servers (plugins)
// =============================================================================

message System {
    EntityId id = 1;
    string name = 2;
    string mcp_server_id = 3;           // Which MCP server provides this
    SystemState state = 4;
    int32 priority = 5;                 // Execution order
    repeated string required_components = 6;  // Component types this system processes
    bytes config = 7;                   // System configuration
}

enum SystemState {
    SYSTEM_STATE_UNSPECIFIED = 0;
    SYSTEM_STATE_ACTIVE = 1;
    SYSTEM_STATE_PAUSED = 2;
    SYSTEM_STATE_ERROR = 3;
}

// =============================================================================
// ECS CORE: TAG
// SQLite Table: tags
// =============================================================================

message Tag {
    EntityId id = 1;
    string name = 2;
    string color = 3;                   // Hex color for UI
    string category = 4;                // Grouping for tags
}

// =============================================================================
// COMMON COMPONENT TYPES
// Reusable component data structures
// =============================================================================

message TransformComponent {
    Vec3 position = 1;
    Quat rotation = 2;
    Vec3 scale = 3;
}

message Vec3 {
    float x = 1;
    float y = 2;
    float z = 3;
}

message Quat {
    float x = 1;
    float y = 2;
    float z = 3;
    float w = 4;
}

message Mat4 {
    repeated float values = 1;          // 16 floats, column-major
}

// =============================================================================
// HIERARCHY & RELATIONSHIPS
// SQLite Table: relationships
// =============================================================================

message Relationship {
    EntityId id = 1;
    string source_id = 2;               // ClusterNode UUID
    string target_id = 3;               // ClusterNode UUID
    RelationshipType type = 4;
    bytes metadata = 5;
}

enum RelationshipType {
    RELATIONSHIP_TYPE_UNSPECIFIED = 0;
    RELATIONSHIP_TYPE_PARENT_CHILD = 1;
    RELATIONSHIP_TYPE_REFERENCE = 2;
    RELATIONSHIP_TYPE_DEPENDENCY = 3;
    RELATIONSHIP_TYPE_LINK = 4;
}

// =============================================================================
// QUERY SUPPORT
// For querying cluster nodes in SQLite
// =============================================================================

message ClusterNodeQuery {
    repeated ClusterNodeType node_types = 1;
    repeated string component_types = 2;
    repeated string tag_ids = 3;
    ClusterNodeState state_filter = 4;
    string parent_id = 5;
    int32 limit = 6;
    int32 offset = 7;
    string order_by = 8;
    bool ascending = 9;
}

message ClusterNodeQueryResult {
    repeated ClusterNode nodes = 1;
    int32 total_count = 2;
    bool has_more = 3;
}
